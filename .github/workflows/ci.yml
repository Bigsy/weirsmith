name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The suite is pinned to a harper.js version, but Harper's curated dictionary
  # grows over time. A weekly run catches fixture words that have landed
  # upstream: once Harper knows one, the test asserting the corpus is genuinely
  # missing fails, and the word should be swapped for one that is still a gap.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # End-to-end smoke test of the CLI against the fixture corpus. There is no
      # pack to publish — weirsmith converts the dictionaries you bring and
      # ships no word data of its own — so nothing is uploaded.
      - run: npm run build
      - run: npm run verify
      # The other formats have no Harper to verify them, so CI at least proves
      # the command runs and writes every file it claims to.
      - run: npm run export
      # The browser UI is a first-class frontend; prove the self-contained
      # static distribution still assembles on every change.
      - run: npm run build:web
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
